version: '3.8'

services:
  # ====================================
  # Nginx Reverse Proxy
  # ====================================
  nginx:
    image: nginx:alpine
    container_name: raqim-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - raqim-network

  # ====================================
  # Raqim AI Application
  # ====================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raqim-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - VITE_DEEPSEEK_API_KEY=${VITE_DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - raqim-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ====================================
  # Redis (Future: Caching & Sessions)
  # ====================================
  redis:
    image: redis:7-alpine
    container_name: raqim-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - raqim-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ====================================
  # PostgreSQL (Future: Main Database)
  # ====================================
  postgres:
    image: postgres:16-alpine
    container_name: raqim-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-raqim}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-raqim_secure_password}
      - POSTGRES_DB=${DB_NAME:-raqim_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - raqim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raqim}"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  raqim-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
